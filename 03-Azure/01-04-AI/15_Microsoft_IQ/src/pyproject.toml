[project]
name = "caldova-iq"
version = "0.1.0"
description = "Caldova: learn the four Microsoft IQs (Web, Fabric, Foundry, Work) by building one agent."
requires-python = ">=3.11"
dependencies = [
    "azure-ai-projects>=2.11.0",
    "azure-identity>=1.25.0",
    "openai>=2.8.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "typer>=0.20.0",
]

[project.scripts]
caldova = "caldova.cli:app"

[dependency-groups]
dev = ["pytest>=8.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["caldova"]
